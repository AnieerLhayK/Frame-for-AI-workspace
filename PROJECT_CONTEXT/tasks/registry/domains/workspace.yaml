# Canonical task definitions for the PROJECT_CONTEXT task domain.
tasks:
  root_script_adapter_removal:
    use_when:
    - Removing root scripts adapters after migrating every active caller to the canonical package modules.
    use_when_zh:
    - 在全部活动调用方迁移至 canonical 包模块后，正式移除根 scripts 适配器。
    required:
    - scripts/workspace/runtime.py
    - scripts/workspace/workspace_cli.py
    - scripts/tests/
    - workspace_manifest.yaml
    - .github/workflows/ci.yml
    - shared/governance/agent_governance.yaml
    external_evidence:
    - Hermes config at ${DATA_ROOT}/hermes/config.yaml
    - managed launcher at ${USER_HOME}/.local/bin/workspace.cmd
    optional:
    - README.md
    - ARCHITECTURE.md
    - USAGE_GUIDES/
    - WORKSPACE_ENGINEERING/
    ignore:
    - mcp/
    - private corpus material
    - skill-local scripts not owned by the workspace root
    prompt:
    - task_routing
    tool_profile: cleanup_migration
    ledger: true
    write_scope:
    - scripts/
    - .github/workflows/ci.yml
    - .claude/hooks/workspace_boundary_guard.ps1
    - opencode.json
    - workspace_manifest.yaml
    - shared/
    - PROJECT_CONTEXT/
    - README.md
    - README.zh-CN.md
    - ARCHITECTURE.md
    - USAGE_GUIDES/
    - WORKSPACE_ENGINEERING/
    - packages/character-system/shared/
    - packages/character-system/engineering/corpus-preparation/qq-raw-material-filter/README.md
    - skills/collaboration-builder/
    - reports/
    - ${DATA_ROOT}/hermes/config.yaml
    - ${DATA_ROOT}/hermes/shell-hooks-allowlist.json
    - ${USER_HOME}/.local/bin/workspace.cmd
    validation:
    - python -m pytest -q scripts/tests
    - python -m scripts.reporting.ci_run --format json
    - python -m compileall -q scripts
    - python -m scripts.workspace.workspace_cli --help
    - python -m scripts.workspace.workspace_cli health --with-tests
    - python -m scripts.validation.validate_manifest
    - python -m scripts.validation.validate_protocols
    - python -m scripts.validation.check_doc_pairs --strict --validate-coverage
    - git diff --check
  change_surface_planning:
    use_when:
    - Changing the read-only planner that compares alternative file sets for one maintenance
      goal.
    use_when_zh:
    - 修改只读方案规划器（比较一个维护目标的多组备选文件集）
    required:
    - PROJECT_CONTEXT/governance/change_surface_policy.md
    - scripts/workspace/plan_change_surface.py
    - scripts/tests/workspace/test_plan_change_surface.py
    - scripts/workspace/workspace_cli.py
    - scripts/tests/workspace/test_workspace_cli.py
    optional:
    - README.md
    - ARCHITECTURE.md
    - shared/workspace/workspace_policy.md
    - shared/workspace/workspace_path_policy.md
    ignore:
    - reports/
    - private corpus material
    - platform loading surfaces
    - unrelated skill implementation
    prompt:
    - task_routing
    tool_profile: workspace_maintenance
    ledger: true
    write_scope:
    - AGENTS.md
    - PROJECT_CONTEXT/governance/change_surface_policy.md
    - PROJECT_CONTEXT/README.md
    - PROJECT_CONTEXT/tasks/registry/index.yaml
    - PROJECT_CONTEXT/tasks/ledger/README.md
    - README.md
    - scripts/workspace/plan_change_surface.py
    - scripts/tests/workspace/test_plan_change_surface.py
    - scripts/workspace/workspace_cli.py
    - scripts/tests/workspace/test_workspace_cli.py
    validation:
    - python -m unittest scripts.tests.workspace.test_plan_change_surface scripts.tests.workspace.test_workspace_cli
    - python -m scripts.workspace.workspace_cli changes plan developer_interface_tooling --intent
      tooling
    - python -m scripts.workspace.resolve_task_context change_surface_planning --format json
    - git diff --check
  developer_interface_tooling:
    use_when:
    - Changing the unified workspace CLI or its command delegation without changing
      underlying tool behavior.
    use_when_zh:
    - 修改统一工作区 CLI 或命令委托行为，不改变底层工具行为
    required:
    - scripts/workspace/workspace_cli.py
    - scripts/tests/workspace/test_workspace_cli.py
    optional:
    - README.md
    - USAGE_GUIDES/QUICK_START/
    - scripts/workspace/resolve_task_context.py
    - scripts/workspace/bootstrap_workspace.py
    - scripts/validation/validate_manifest.py
    - scripts/validation/validate_protocols.py
    - scripts/validation/check_links.ps1
    - scripts/*_model_advice.py
    - scripts/tests/workspace/test_*model_advice.py
    ignore:
    - reports/
    - private corpus material
    - platform loading surfaces
    - unrelated skill implementation
    prompt:
    - task_routing
    tool_profile: workspace_maintenance
    ledger: true
    write_scope:
    - PROJECT_CONTEXT/tasks/registry/index.yaml
    - PROJECT_CONTEXT/tasks/ledger/README.md
    - README.md
    - scripts/workspace/workspace_cli.py
    - scripts/*_model_advice.py
    - scripts/tests/workspace/test_workspace_cli.py
    - scripts/tests/workspace/test_*model_advice.py
    - USAGE_GUIDES/QUICK_START/
    validation:
    - python -m unittest scripts.tests.workspace.test_workspace_cli
    - python -m scripts.workspace.workspace_cli task list
    - python -m scripts.workspace.workspace_cli prompt list
    - python -m scripts.workspace.workspace_cli bootstrap --print-json
    - git diff --check
  failure_diagnostics_tooling:
    use_when:
    - Changing the read-only developer explanation of required, optional, placeholder,
      or path-policy failures.
    use_when_zh:
    - 修改只读的开发者错误解释界面（解释必需、可选、占位符或路径策略的失败原因）
    required:
    - shared/workspace/failure_policy.md
    - scripts/workspace/failure_check.py
    - scripts/tests/workspace/test_failure_check.py
    optional:
    - scripts/workspace/resolve_task_context.py
    - scripts/tests/workspace/test_resolve_task_context.py
    - scripts/workspace/workspace_cli.py
    - scripts/tests/workspace/test_workspace_cli.py
    - USAGE_GUIDES/QUICK_START/workspace_cli.md
    ignore:
    - reports/
    - private corpus material
    - platform loading surfaces
    - skill implementation
    prompt:
    - task_routing
    tool_profile: workspace_maintenance
    ledger: true
    write_scope:
    - README.md
    - PROJECT_CONTEXT/tasks/registry/index.yaml
    - PROJECT_CONTEXT/tasks/ledger/README.md
    - USAGE_GUIDES/QUICK_START/workspace_cli.md
    - scripts/workspace/failure_check.py
    - scripts/tests/workspace/test_failure_check.py
    - scripts/workspace/workspace_cli.py
    - scripts/tests/workspace/test_workspace_cli.py
    validation:
    - python -m unittest scripts.tests.workspace.test_failure_check scripts.tests.workspace.test_workspace_cli
    - python -m scripts.workspace.workspace_cli failure check skill_metadata_update --bind target-skill=packages/character-system/engineering/generation/character-generator
    - python -m scripts.workspace.resolve_task_context failure_diagnostics_tooling --format
      json
    - git diff --check
  governance_summary_tooling:
    use_when:
    - Changing the read-only workspace version, inventory, Git, or recent-governance
      summary.
    use_when_zh:
    - 修改只读工作区版本、清单、Git 或近期治理摘要
    required:
    - workspace_manifest.yaml
    - scripts/workspace/workspace_summary.py
    - scripts/tests/workspace/test_workspace_summary.py
    optional:
    - README.md
    - PROJECT_CONTEXT/knowledge/index.yaml
    - PROJECT_CONTEXT/tasks/ledger/README.md
    - USAGE_GUIDES/QUICK_START/workspace_cli.md
    - scripts/workspace/workspace_cli.py
    - scripts/tests/workspace/test_workspace_cli.py
    ignore:
    - reports/ contents
    - private corpus material
    - skill implementation details
    - task ledger entries beyond the requested recent limit
    prompt:
    - task_routing
    tool_profile: workspace_maintenance
    ledger: true
    write_scope:
    - README.md
    - PROJECT_CONTEXT/tasks/registry/index.yaml
    - PROJECT_CONTEXT/tasks/ledger/README.md
    - USAGE_GUIDES/QUICK_START/workspace_cli.md
    - scripts/workspace/workspace_summary.py
    - scripts/tests/workspace/test_workspace_summary.py
    - scripts/workspace/workspace_cli.py
    - scripts/tests/workspace/test_workspace_cli.py
    validation:
    - python -m unittest scripts.tests.workspace.test_workspace_summary scripts.tests.workspace.test_workspace_cli
    - python -m scripts.workspace.workspace_cli summary
    - python -m scripts.workspace.workspace_cli summary --format json
    - python -m scripts.workspace.resolve_task_context governance_summary_tooling
    - git diff --check
  ignore_policy_update:
    use_when:
    - Splitting root .gitignore rules into independently owned subdirectory ignore
      files, or documenting where future ignore rules belong, while preserving matching
      semantics.
    use_when_zh:
    - 在保持匹配语义不变的前提下，将根 .gitignore 规则拆分到独立子目录的 ignore 文件。
    required:
    - AGENTS.md
    - PROJECT_CONTEXT/tasks/registry/index.yaml
    - PROJECT_CONTEXT/governance/context_budget.md
    - .gitignore
    - existing nested .gitignore files
    optional:
    - PROJECT_CONTEXT/tasks/ledger/README.md
    - workspace_manifest.yaml
    - shared/workspace/manifest_portability_policy.md
    - shared/workspace/workspace_path_policy.md
    ignore:
    - private corpus material
    - platform projections as editable source
    - unrelated skill-specific ignore conventions
    prompt:
    - minimal_edit
    tool_profile: workspace_maintenance
    ledger: true
    write_scope:
    - AGENTS.md
    - .gitignore
    - .claude/
    - mcp/
    - reports/
    - PROJECT_CONTEXT/tasks/registry/index.yaml
    - PROJECT_CONTEXT/tasks/ledger/README.md
    validation:
    - python -m unittest scripts.tests.validation.test_check_doc_pairs
    - python -m scripts.validation.check_doc_pairs --validate-coverage
    - git diff --check
  workspace_developer_experience:
    use_when:
    - Changing the integrated human-facing workspace CLI experience across health
      summaries, task list rendering, help text, explain output, report freshness
      messaging, or quick-start guidance.
    use_when_zh:
    - 改进面向人的 workspace CLI 综合体验，包括 health 分层、任务列表渲染、帮助文本、explain 输出、报告 freshness 提示或
      quick-start 指南
    required:
    - scripts/workspace/workspace_cli.py
    - scripts/workspace/workspace_health.py
    - scripts/validation/check_links.ps1
    - scripts/platform/setup_links.ps1
    - scripts/workspace/resolve_task_context.py
    - scripts/workspace/workspace_explain.py
    - scripts/reporting/report_status.py
    - USAGE_GUIDES/QUICK_START/workspace_cli.md
    - scripts/tests/workspace/test_workspace_cli.py
    - scripts/tests/workspace/test_workspace_health.py
    - scripts/tests/workspace/test_resolve_task_context.py
    - scripts/tests/workspace/test_workspace_explain.py
    - scripts/tests/reporting/test_report_status.py
    optional:
    - README.md
    - ARCHITECTURE.md
    - PROJECT_CONTEXT/knowledge/index.yaml
    - reports/ current snapshots
    ignore:
    - external platform configuration
    - private corpus material
    - skill implementation
    prompt:
    - task_routing
    tool_profile: workspace_maintenance
    ledger: true
    write_scope:
    - PROJECT_CONTEXT/tasks/registry/index.yaml
    - PROJECT_CONTEXT/tasks/ledger/README.md
    - USAGE_GUIDES/QUICK_START/workspace_cli.md
    - scripts/workspace/workspace_cli.py
    - scripts/workspace/workspace_health.py
    - scripts/validation/check_links.ps1
    - scripts/platform/setup_links.ps1
    - scripts/workspace/resolve_task_context.py
    - scripts/workspace/workspace_explain.py
    - scripts/reporting/report_status.py
    - scripts/tests/workspace/test_workspace_cli.py
    - scripts/tests/workspace/test_workspace_health.py
    - scripts/tests/workspace/test_resolve_task_context.py
    - scripts/tests/workspace/test_workspace_explain.py
    - scripts/tests/reporting/test_report_status.py
    - reports/current/manifest_validation_report.md
    - reports/current/protocol_validation_report.md
    - reports/current/workspace_health_report.md
    - reports/current/workspace_setup_report.md
    validation:
    - python -m unittest scripts.tests.workspace.test_workspace_cli scripts.tests.workspace.test_workspace_health
      scripts.tests.workspace.test_resolve_task_context scripts.tests.workspace.test_workspace_explain
      scripts.tests.reporting.test_report_status
    - python -m unittest discover -s scripts/tests -p "test_*.py"
    - workspace task list
    - workspace explain mechanism task-routing
    - workspace explain path scripts/workspace/workspace_cli.py
    - workspace validate links
    - workspace --help
    - workspace reports status --strict
    - workspace health --with-tests
    - git diff --check
  workspace_health_tooling:
    use_when:
    - Changing the live read-only workspace health aggregator or its check summaries.
    use_when_zh:
    - 修改只读工作区健康聚合器或检查摘要
    required:
    - scripts/workspace/workspace_health.py
    - scripts/tests/workspace/test_workspace_health.py
    optional:
    - scripts/workspace/workspace_cli.py
    - scripts/tests/workspace/test_workspace_cli.py
    - scripts/workspace/workspace_health.py
    - USAGE_GUIDES/QUICK_START/workspace_cli.md
    - scripts/workspace/bootstrap_workspace.py
    - scripts/workspace/find_knowledge.py
    - scripts/reporting/report_status.py
    - scripts/validation/check_links.ps1
    ignore:
    - reports/ contents
    - private corpus material
    - skill implementation
    - platform directories beyond the existing link checker
    prompt:
    - task_routing
    tool_profile: workspace_maintenance
    ledger: true
    write_scope:
    - README.md
    - PROJECT_CONTEXT/tasks/registry/index.yaml
    - PROJECT_CONTEXT/tasks/ledger/README.md
    - USAGE_GUIDES/QUICK_START/workspace_cli.md
    - scripts/workspace/workspace_health.py
    - scripts/tests/workspace/test_workspace_health.py
    - scripts/workspace/workspace_cli.py
    - scripts/tests/workspace/test_workspace_cli.py
    validation:
    - python -m unittest scripts.tests.workspace.test_workspace_health scripts.tests.workspace.test_workspace_cli
    - python -m scripts.workspace.workspace_cli health --format json
    - python -m scripts.workspace.workspace_cli health --with-tests
    - python -m scripts.workspace.resolve_task_context workspace_health_tooling --format json
    - git diff --check
  workspace_launcher_tooling:
    use_when:
    - Changing or installing the user-local short workspace command.
    use_when_zh:
    - 修改或安装用户本地的快捷 workspace 命令
    required:
    - scripts/workspace/workspace_launcher.py
    - scripts/tests/workspace/test_workspace_launcher.py
    - the selected user-local bin directory is on PATH
    - no unmanaged workspace.cmd exists at the target
    optional:
    - scripts/workspace/workspace_cli.py
    - scripts/tests/workspace/test_workspace_cli.py
    - USAGE_GUIDES/QUICK_START/workspace_cli.md
    ignore:
    - PowerShell profile files
    - system-wide PATH
    - unrelated commands in user-local bin
    - skill implementation
    prompt:
    - minimal_edit
    tool_profile: workspace_maintenance
    ledger: true
    write_scope:
    - README.md
    - PROJECT_CONTEXT/tasks/registry/index.yaml
    - PROJECT_CONTEXT/tasks/ledger/README.md
    - USAGE_GUIDES/QUICK_START/workspace_cli.md
    - scripts/workspace/workspace_launcher.py
    - scripts/tests/workspace/test_workspace_launcher.py
    - scripts/workspace/workspace_cli.py
    - scripts/tests/workspace/test_workspace_cli.py
    - scripts/workspace/workspace_health.py
    - the explicitly selected managed workspace.cmd
    validation:
    - python -m unittest scripts.tests.workspace.test_workspace_launcher scripts.tests.workspace.test_workspace_cli
    - python -m scripts.workspace.workspace_cli launcher install --dry-run
    - python -m scripts.workspace.workspace_cli launcher status
    - python -m scripts.workspace.resolve_task_context workspace_launcher_tooling --format json
    - git diff --check
