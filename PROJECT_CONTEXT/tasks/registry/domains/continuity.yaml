# Canonical task definitions for the PROJECT_CONTEXT task domain.
tasks:
  reasonix_hermes_ci_repair:
    use_when:
    - Repairing the user-approved Reasonix and Hermes installations and the associated Workspace/Frame CI regressions.
    use_when_zh:
    - 修复用户已批准的 Reasonix、Hermes 安装及关联 Workspace/Frame CI 回归。
    required:
    - shared/governance/agent_registry.yaml
    - shared/governance/git_integration_policy.md
    - skills/governance/windows-ai-storage-governor/SKILL.md
    - skills/governance/windows-ai-storage-governor/references/safety-policy.md
    - PROJECT_CONTEXT/documentation/doc_pair_registry.yaml
    - reasonix.toml
    optional: []
    ignore:
    - credential values and conversation contents
    - unrelated installations and project trees
    tool_profile: cleanup_migration
    ledger: true
    budget: {required_warn_tokens: 14000, expanded_warn_tokens: 20000}
    write_scope:
    - PROJECT_CONTEXT/tasks/records/**
    - PROJECT_CONTEXT/tasks/ledger/**
    - reports/ai-tool-updates/20261007-repair/**
    - reports/current/manifest_validation_report.md
    - reports/current/protocol_validation_report.md
    - reasonix.toml
    - scripts/publishing/registered_repo_sync.py
    - scripts/tests/publishing/test_registered_repo_sync.py
    - scripts/tests/publishing/test_sync_ai_workbench_repo.py
    - scripts/workspace/verify_change_scope.py
    - scripts/tests/workspace/test_verify_change_scope.py
    - scripts/tests/workspace/test_hermes_workspace_guard.py
    - skills/content/mardocx/SKILL.md
    - skills/content/mardocx/scripts/**
    - skills/content/mardocx/tests/**
    - scripts/tests/workspace/test_standalone_skill_contracts.py
    - scripts/tests/publishing/test_publish_skill_collection.py
    - '<npm-prefix-path>/node_modules/reasonix/'
    - '<npm-prefix-path>/node_modules/.reasonix-*/**'
    - '<npm-prefix-path>/node_modules/.package-lock.json'
    - '<npm-prefix-path>/reasonix'
    - '<npm-prefix-path>/reasonix.cmd'
    - '<npm-prefix-path>/reasonix.ps1'
    - '<npm-cache-path>/'
    - '<reasonix-data-path>/'
    - ${DATA_ROOT}/reasonix-local/workspace-leases/
    - '<hermes-install-path>/'
    - '<hermes-data-path>/config.yaml'
    - '<hermes-data-path>/.env'
    - '<hermes-data-path>/auth.json'
    - '<hermes-data-path>/state.db'
    - '<hermes-data-path>/state.db-wal'
    - '<hermes-data-path>/state.db-shm'
    - '<hermes-data-path>/logs/'
    - '<hermes-data-path>/cache/'
    - '<hermes-data-path>/gateway_state.json'
    - '<hermes-data-path>/uv-cache/'
    - '<upgrade-backup-path>/'
    - '<upgrade-staging-path>/'
    - '<upgrade-lease-path>'
    validation:
    - python -m scripts.reporting.ci_run
    - python -m scripts.validation.validate_manifest
    - python -m scripts.validation.validate_protocols
    - python -m scripts.validation.check_doc_pairs --validate-coverage
    - workspace records validate
    - Verify isolated and final tool installations without model requests or Bot messages.
    - git diff --check
  registered_ai_tool_update:
    use_when:
    - Updating explicitly authorized registered AI-tool installations in place and verifying storage boundaries.
    use_when_zh:
    - 原位更新用户明确授权的已登记 AI 工具并验证存储边界
    required:
    - shared/governance/agent_registry.yaml
    - skills/governance/windows-ai-storage-governor/SKILL.md
    - skills/governance/windows-ai-storage-governor/references/safety-policy.md
    - shared/governance/git_integration_policy.md
    optional: []
    ignore:
    - account credentials and conversation contents
    - unrelated installed packages and project trees
    tool_profile: cleanup_migration
    ledger: true
    budget: {required_warn_tokens: 8000, expanded_warn_tokens: 12000}
    write_scope:
    - PROJECT_CONTEXT/tasks/records/**
    - PROJECT_CONTEXT/tasks/ledger/**
    - reports/ai-tool-updates/**
    - '<npm-prefix-path>/node_modules/@openai/codex/'
    - '<npm-prefix-path>/node_modules/@openai/.codex-*/**'
    - '<npm-prefix-path>/node_modules/@anthropic-ai/claude-code/'
    - '<npm-prefix-path>/node_modules/@anthropic-ai/.claude-code-*/**'
    - '<npm-prefix-path>/node_modules/opencode-ai/'
    - '<npm-prefix-path>/node_modules/.opencode-ai-*/**'
    - '<npm-prefix-path>/node_modules/reasonix/'
    - '<npm-prefix-path>/node_modules/.reasonix-*/**'
    - '<npm-prefix-path>/node_modules/.package-lock.json'
    - '<npm-prefix-path>/codex'
    - '<npm-prefix-path>/codex.cmd'
    - '<npm-prefix-path>/codex.ps1'
    - '<npm-prefix-path>/claude'
    - '<npm-prefix-path>/claude.cmd'
    - '<npm-prefix-path>/claude.ps1'
    - '<npm-prefix-path>/opencode'
    - '<npm-prefix-path>/opencode.cmd'
    - '<npm-prefix-path>/opencode.ps1'
    - '<npm-prefix-path>/reasonix'
    - '<npm-prefix-path>/reasonix.cmd'
    - '<npm-prefix-path>/reasonix.ps1'
    - '<npm-cache-path>/'
    - '<harness-runtime-path>/'
    - '<harness-cache-path>/'
    - '<upgrade-staging-path>/'
    - '<upgrade-lease-path>'
    validation:
    - Verify recorded package versions and CLI resolution without model requests.
    - Verify preserved storage links, configuration paths and updater rollback evidence.
    - workspace records validate
    - git diff --check
  cleanup_migration:
    context_views:
      workspace_manifest.yaml: [workspace, platform_roots, session_stores, output_roots, runtime_roots, external_roots, shared, packages, skills, plugin_skills, projections, protocols, portability, discovery, failure_policy]
    use_when:
    - Deleting legacy directories, moving tool binaries, migrating data, or changing
      local deployment paths.
    use_when_zh:
    - 删除遗留目录、移动工具二进制文件、迁移数据或更改本地部署路径
    required:
    - AGENTS.md
    - PROJECT_CONTEXT/tasks/registry/index.yaml
    - PROJECT_CONTEXT/governance/context_budget.md
    - workspace_manifest.yaml
    - shared/workspace/manifest_portability_policy.md
    - shared/workspace/workspace_path_policy.md
    - git status --short --untracked-files=all
    - explicit user approval for every destructive path
    optional:
    - selected migration planner, validator, or continuity route
    ignore:
    - reports/legacy_git_metadata/
    - private corpus material
    - cleanup_migration
    tool_profile: cleanup_migration
    ledger: true
    budget:
      required_warn_tokens: 16000
      expanded_warn_tokens: 17000
      hard_max_tokens: 17000
    write_scope:
      - AGENTS.md
      - CLAUDE.md
      - .claude/settings.json
      - .claude/model-routing-advice.json
      - .claude/model-routing-advice.local.json
      - .claude/hooks/model_routing_guard.ps1
      - ARCHITECTURE.md
      - README.md
      - README.zh-CN.md
      - USAGE_GUIDES/QUICK_START/beginner_guide.md
      - USAGE_GUIDES/QUICK_START/onboarding.md
      - USAGE_GUIDES/QUICK_START/path_mapping_reference.md
      - workspace_manifest.yaml
      - PROJECT_CONTEXT/
      - reports/
      - scripts/
      - shared/
      - USAGE_GUIDES/
      - WORKSPACE_ENGINEERING/
      - packages/character-system/
      - external-skills/README.md
      - external-skills/README.zh-CN.md
      - skills/far-repo-governor/SKILL.md
      - packages/character-system/shared/versioning_policy.md
    validation:
    - python -m scripts.validation.validate_manifest when manifest changes
    - powershell -ExecutionPolicy Bypass -File scripts/validation/check_links.ps1 when projections
      change
    - python -m scripts.workspace.workspace_cli sessions audit when source paths used by agents
      move
  cleanup_migration_audit:
    use_when:
    - Auditing explicitly named cleanup or migration targets and producing a reversible plan without moving or deleting anything.
    use_when_zh:
    - 只读审计明确命名的清理或迁移目标并生成可逆计划，不移动或删除任何内容
    required:
    - AGENTS.md
    - shared/workspace/workspace_path_policy.md
    - git status --short --untracked-files=all
    - explicitly named target paths
    optional: []
    ignore:
    - whole-drive search
    - unnamed legacy paths
    - file contents not needed for path classification
    - cleanup_migration
    tool_profile: workspace_readonly
    ledger: false
    budget:
      required_warn_tokens: 8000
      expanded_warn_tokens: 10000
      hard_max_tokens: 10000
    validation:
    - confirm resolved targets and rollback conditions in the audit receipt
  session_continuity:
    use_when:
    - Auditing, backing up, mapping, or recovering Claude Code or OpenCode sessions
      after source paths move.
    use_when_zh:
    - 审计、备份、映射或恢复 Claude Code 或 OpenCode 会话（在源路径移动后）
    required:
    - workspace_manifest.yaml
    - shared/operations/session_continuity_policy.md
    - PROJECT_CONTEXT/continuity/session_migrations.json
    - scripts/workspace/session_continuity.py
    optional:
    - PROJECT_CONTEXT/continuity/current_status.md
    - PROJECT_CONTEXT/continuity/session_handoff.md
    - tool-native session list or export output
    ignore:
    - private conversation content beyond metadata needed for continuity
    - unrelated skill implementation
    - reports/
    - cleanup_migration
    tool_profile: cleanup_migration
    ledger: true
    write_scope:
    - workspace_manifest.yaml
    - shared/operations/session_continuity_policy.md
    - PROJECT_CONTEXT/continuity/session_migrations.json
    - PROJECT_CONTEXT/continuity/current_status.md
    - PROJECT_CONTEXT/continuity/session_handoff.md
    - PROJECT_CONTEXT/tasks/ledger/README.md
    - scripts/workspace/session_continuity.py
    - scripts/tests/workspace/test_session_continuity.py
    - scripts/workspace/workspace_cli.py
    - scripts/tests/workspace/test_workspace_cli.py
    - explicitly approved external session backup paths
    validation:
    - python -m unittest scripts.tests.workspace.test_session_continuity scripts.tests.workspace.test_workspace_cli
    - python -m scripts.workspace.workspace_cli sessions audit
    - python -m scripts.validation.validate_manifest
    - git diff --check
  task_outcome_records:
    use_when:
    - Creating, validating, summarizing, or evolving structured task outcome records
      and their ledger integration.
    use_when_zh:
    - 创建、验证、汇总或演进结构化任务结果记录及其与任务台账的集成。
    required:
    - PROJECT_CONTEXT/tasks/records/README.md
    - PROJECT_CONTEXT/tasks/records/schema.json
    - PROJECT_CONTEXT/tasks/ledger/README.md
    - scripts/workspace/task_records.py
    - scripts/workspace/task_records.py
    - scripts/workspace/resolve_task_context.py
    - scripts/workspace/task_ledger.py
    - scripts/workspace/workflow_check.py
    - scripts/workspace/verify_change_scope.py
    - scripts/workspace/agent_governance.py
    - scripts/tests/workspace/test_task_records.py
    - scripts/tests/workspace/test_resolve_task_context.py
    - scripts/tests/workspace/test_workflow_check.py
    - scripts/workspace/workspace_cli.py
    - AGENTS.md
    - shared/workspace/workspace_policy.md
    - shared/governance/agent_governance_policy.md
    optional:
    - scripts/workspace/workspace_summary.py
    - scripts/tests/workspace/test_workspace_summary.py
    - PROJECT_CONTEXT/tasks/registry/index.yaml
    ignore:
    - provider transcripts, credentials, raw prompts, and volatile tool logs
    - generated reports unless a report task explicitly owns them
    - task_routing
    tool_profile: workspace_maintenance
    ledger: true
    write_scope:
    - PROJECT_CONTEXT/tasks/records/
    - PROJECT_CONTEXT/tasks/ledger/
    - PROJECT_CONTEXT/tasks/registry/index.yaml
    - PROJECT_CONTEXT/continuity/current_status.md
    - PROJECT_CONTEXT/governance/context_budget.md
    - PROJECT_CONTEXT/README.md
    - PROJECT_CONTEXT/README.zh-CN.md
    - PROJECT_CONTEXT/tasks/ledger.md
    - ARCHITECTURE.md
    - scripts/publishing/publish_public.py
    - scripts/workspace/resolve_task_context.py
    - scripts/workspace/resolve_task_context.py
    - scripts/workspace/task_records.py
    - scripts/workspace/task_records.py
    - scripts/workspace/task_ledger.py
    - scripts/workspace/workflow_check.py
    - scripts/workspace/verify_change_scope.py
    - scripts/workspace/agent_governance.py
    - scripts/workspace/workspace_cli.py
    - scripts/tests/workspace/test_workflow_check.py
    - scripts/tests/platform/test_platform_agent_guards.py
    - scripts/tests/workspace/test_workspace_cli.py
    - AGENTS.md
    - shared/workspace/workspace_policy.md
    - shared/governance/agent_governance_policy.md
    - .claude/hooks/workspace_boundary_guard.ps1
    - .opencode/plugins/workspace-governance.js
    - reasonix.toml
    - scripts/workspace/workspace_summary.py
    - scripts/tests/workspace/test_task_records.py
    - scripts/tests/workspace/test_resolve_task_context.py
    - scripts/tests/workspace/test_workspace_summary.py
    validation:
    - python -m unittest scripts.tests.workspace.test_task_records scripts.tests.workspace.test_resolve_task_context
      scripts.tests.workspace.test_workflow_check scripts.tests.workspace.test_workspace_summary
      scripts.tests.workspace.test_workspace_cli scripts.tests.workspace.test_agent_governance
      scripts.tests.platform.test_platform_agent_guards
    - python -m scripts.workspace.task_ledger validate
    - python -m scripts.workspace.task_records validate
    - python -m scripts.workspace.workspace_cli records summary
    - git diff --check
